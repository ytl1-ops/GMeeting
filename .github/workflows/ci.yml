name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:                      # un nouveau push annule l'exécution précédente de la même branche
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15           # un job qui se fige (miroir apt, réseau) échoue au lieu de rester « en cours » des heures
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer ffmpeg (conversion et assemblage audio)
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt
      - name: Syntaxe de l'interface (JavaScript)
        run: for f in app/static/*.js; do node --check "$f"; done
      - name: Tests
        run: pytest -q
