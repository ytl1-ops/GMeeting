name: docker-arm64

# Contrôle que l'image du serveur se construit ET fonctionne sur ARM64 (processeurs ARM : Oracle Cloud « Always Free » Ampere A1, Raspberry Pi, Apple Silicon sous Linux…).
# Émulation QEMU sur un runner x86 : lent (plusieurs minutes), d'où un workflow à part, déclenché seulement quand l'image ou ses dépendances changent, ou à la main.
on:
  workflow_dispatch:
  pull_request:
    paths: ["Dockerfile", "requirements.txt", "docker-compose.yml", ".github/workflows/docker-arm64.yml"]
  push:
    branches: [main]
    paths: ["Dockerfile", "requirements.txt", "docker-compose.yml", ".github/workflows/docker-arm64.yml"]

concurrency:
  group: docker-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    name: image ARM64 (construction + démarrage + exports)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - name: Construction de l'image pour ARM64 (émulée)
        run: docker buildx build --platform linux/arm64 --load -t gmeeting:arm64 .
      - name: Démarrage durci (comme en production) et sonde de santé
        run: |
          docker run -d --name gma --platform linux/arm64 --read-only --tmpfs /tmp:size=64m --cap-drop ALL --security-opt no-new-privileges:true \
            -e GMEETING_PASSWORD=essai gmeeting:arm64
          for i in $(seq 1 90); do s=$(docker inspect -f '{{.State.Health.Status}}' gma 2>/dev/null || echo none); [ "$s" = healthy ] && break; sleep 5; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' gma)" = healthy ] || { docker logs gma; exit 1; }
          echo "architecture : $(docker exec gma uname -m)"
          test "$(docker exec gma uname -m)" = aarch64
          test "$(docker exec gma id -u)" = 10001
      - name: Outils audio et bibliothèques de documents sur ARM64
        run: |
          docker exec gma ffmpeg -version | head -1
          docker exec gma ffmpeg -hide_banner -encoders | grep -q libopus
          docker exec gma python -c "import reportlab, docx, openpyxl, pptx, PIL; print('bibliothèques de documents : ok')"
      - name: Export réel des quatre formats sur ARM64
        run: |
          docker exec -i gma python - <<'PY'
          from app import exporters, generate
          a = generate.normalize({"titre": "Essai ARM64", "resume": "Résumé de contrôle.", "decisions": [{"decision": "Valider", "responsable": "A"}]}, {})
          for doc, fmt in (("pv", "pdf"), ("cr", "docx"), ("note", "xlsx"), ("deck_visual", "pptx")):
              data, _, name = exporters.export(a, doc, fmt, None)
              assert len(data) > 1500, (doc, fmt, len(data))
              print("ok", name, len(data))
          PY
      - name: Journaux en cas d'échec
        if: failure()
        run: docker logs gma || true
