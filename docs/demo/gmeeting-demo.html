/* GMeeting – enregistreur continu.

 * Objectifs : ne jamais perdre l'audio d'une réunion et reprendre seul après un appel téléphonique.

 *  - Un AudioContext + une destination persistent : le micro peut être remplacé à chaud (retour d'appel)
 *    sans interrompre le MediaRecorder.
 *  - Surveillance : micro muet/coupé, enregistreur arrêté, contexte audio suspendu, retour au premier plan,
 *    retour du réseau. Si le navigateur exige un geste pour rouvrir le micro : état « needs-tap ».

  /* ---------------------------------------------------------------- stockage local (repli mémoire) */
  const mem = { [CH]: new Map(), [SES]: new Map() };
  let dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try {
        const r = indexedDB.open("gmeeting", 1);
        r.onupgradeneeded = () => { r.result.createObjectStore(CH, { keyPath: "key" }); r.result.createObjectStore(SES, { keyPath: "id" }); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch { res(null); }
    });
    return dbp;
  }
  const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const store = {
    async put(name, obj) {
      const d = await db(); const key = obj.key ?? obj.id;
      if (!d) return void mem[name].set(key, obj);
      try { await req(d.transaction(name, "readwrite").objectStore(name).put(obj)); }
      catch { mem[name].set(key, obj); }  // quota ou mode privé : on garde en mémoire plutôt que de perdre
    },
    async get(name, key) {
      const d = await db();
      if (mem[name].has(key)) return mem[name].get(key);
      return d ? req(d.transaction(name).objectStore(name).get(key)) : undefined;
    },
    async del(name, key) {
      mem[name].delete(key); const d = await db();
      if (d) try { await req(d.transaction(name, "readwrite").objectStore(name).delete(key)); } catch {}
    },
    async all(name) {
      const d = await db(); const out = new Map(mem[name]);
      if (d) for (const o of await req(d.transaction(name).objectStore(name).getAll())) out.set(o.key ?? o.id, o);
      return [...out.values()];
    },
    async chunksOf(id) { return (await store.all(CH)).filter((c) => c.id === id).sort((a, b) => (a.key < b.key ? -1 : 1)); },
  };
  const ckey = (id, part, seq) => `${id}:${String(part).padStart(3, "0")}:${String(seq).padStart(6, "0")}`;

  /* ---------------------------------------------------------------- envoi (reprenable) */
  const flushing = new Map(), retrying = new Map();
  const listeners = new Set();
  const notify = (id) => listeners.forEach((f) => f(id));

  /** Identifiant généré sur l'appareil : permet de démarrer sans réseau (mode avion). */
  const genId = () => [...crypto.getRandomValues(new Uint8Array(6))].map((b) => b.toString(16).padStart(2, "0")).join("");

  /** Déclare la session au serveur. 'offline' = injoignable (réseau coupé / erreur serveur) → on réessaiera plus tard. */
  async function register(id, meta, startedAt) {
    let r;
    try { r = await fetch("/api/recordings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...meta, id, started_at: startedAt }) }); }
    catch { return "offline"; }
    if (r.status >= 500) return "offline";
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
    return "ok";
  }
  /** Idempotent. Les sessions créées hors-ligne sont déclarées ici, au premier envoi possible. */
  async function ensureRegistered(id) {
    const ses = await store.get(SES, id);
    if (!ses || ses.registered) return;
    if ((await register(id, ses.meta || {}, ses.startedAt)) !== "ok") throw new Error("serveur injoignable");
    await store.put(SES, { ...(await store.get(SES, id)), registered: true });
  }

  function flush(id) {
    if (flushing.has(id)) return flushing.get(id);
    const p = (async () => {
      await ensureRegistered(id);
      for (;;) {
        const chunks = await store.chunksOf(id);
        if (!chunks.length) return;
        for (const c of chunks) {
          const r = await fetch(`/api/recordings/${id}/parts/${c.part}/chunks/${c.seq}`, {
            method: "PUT", body: c.blob, headers: { "Content-Type": "application/octet-stream" } });

          if (!r.ok && r.status !== 409 && r.status !== 404) throw new Error("HTTP " + r.status);
          await store.del(CH, c.key); notify(id);

  }
  function scheduleFlush(id, attempt = 0) {
    if (retrying.has(id)) return;
    flush(id).then(() => notify(id)).catch(() => {
      notify(id);
      retrying.set(id, setTimeout(() => { retrying.delete(id); scheduleFlush(id, attempt + 1); }, Math.min(2000 * 2 ** attempt, 30000)));
    });
  }
  window.addEventListener("online", () => { retrying.forEach((t, id) => { clearTimeout(t); retrying.delete(id); scheduleFlush(id); }); resumePending(); });

  async function pendingCount(id) { return (await store.chunksOf(id)).length; }

  /* ---------------------------------------------------------------- finalisation */
  async function requestFinish(id, payload) {
    const ses = (await store.get(SES, id)) || { id };
    await store.put(SES, { ...ses, id, finishRequested: true, payload });
    try { return await completeFinish(id); }
    catch (e) { scheduleFinish(id); throw e; }   // réseau/serveur indisponible : on réessaie seul, avec délai croissant
  }
  const finRetry = new Map();
  function scheduleFinish(id, attempt = 0) {
    if (finRetry.has(id)) return;
    finRetry.set(id, setTimeout(() => { finRetry.delete(id); completeFinish(id).catch(() => scheduleFinish(id, attempt + 1)); }, Math.min(3000 * 2 ** attempt, 60000)));
  }
  /** Envoie les derniers segments puis déclenche la rédaction. Lève une erreur si le réseau est absent (reprise ultérieure). */
  async function completeFinish(id) {
    const ses = await store.get(SES, id);
    if (!ses || !ses.finishRequested) return false;
    await flush(id);
    const r = await fetch(`/api/recordings/${id}/finish`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ses.payload || {}) });
    if (!r.ok && r.status !== 409) throw new Error((await r.json().catch(() => ({}))).detail || "HTTP " + r.status);
    await store.del(SES, id);
    return true;
  }
  /** Au retour du réseau / au démarrage : termine silencieusement les fins d'enregistrement restées en attente. */
  async function resumePending() {
    for (const s of await store.all(SES)) if (s.finishRequested) completeFinish(s.id).catch(() => scheduleFinish(s.id));
  }
  /** Enregistrements locaux jamais finalisés (page fermée/rechargée en cours de route). */
  async function orphans(activeId) {
    const out = [];
    for (const s of await store.all(SES)) {
      if (s.id === activeId || s.finishRequested) continue;
      const n = await pendingCount(s.id);
      out.push({ ...s, pending: n });

    return out;
  }
  async function discard(id) {
    for (const c of await store.chunksOf(id)) await store.del(CH, c.key);
    await store.del(SES, id);
  }

  /* ---------------------------------------------------------------- session d'enregistrement */
  class Session {
    constructor({ onState = () => {}, onLevel = () => {}, onEvent = () => {} } = {}) {
      Object.assign(this, { onState, onLevel, onEvent });
      this.state = "idle"; this.intended = "idle"; this.part = -1; this.seq = 0;
      this.markers = []; this.events = []; this.openInt = null; this.acc = 0; this.t0 = 0;

    async start(meta, withTab, profile = "equilibre") {

      this.id = genId(); this.meta = meta; this.startedAt = new Date().toISOString();
      this.profile = PROFILES[profile] ? profile : "equilibre";
      this.ctx = new AudioContext();
      this.dest = this.ctx.createMediaStreamDestination();
      this.dest.channelCount = 1;                 // mono : la parole n'a pas besoin de stéréo, et c'est deux fois moins de données
      this.dest.channelCountMode = "explicit";

      this.ctx.onstatechange = () => this.check();

        await this.attachMic();
        if (withTab) await this.attachTab();

        this.registered = (await register(this.id, meta, this.startedAt)) === "ok";

      this.startPart();

      document.addEventListener("visibilitychange", this._vis);
      window.addEventListener("online", this._vis);

    }

    /* --- sources audio */
    async attachMic() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
      const track = stream.getAudioTracks()[0];
      track.addEventListener("mute", () => this.beginInt("appel ou micro occupé"));
      track.addEventListener("unmute", () => this.endInt());
      track.addEventListener("ended", () => { this.beginInt("micro coupé"); this.recover(); });

      this.micStream = stream; this.micTrack = track;
      this.micNode = this.ctx.createMediaStreamSource(stream);

    }
    async attachTab() {

        disp.getTracks().forEach((t) => t.stop());
        throw new Error("Aucun son partagé. Dans la fenêtre de partage, choisissez un onglet (Chrome/Edge) et cochez « Partager l'audio de l'onglet ».");
      }

      const node = this.ctx.createMediaStreamSource(new MediaStream(disp.getAudioTracks()));
      node.connect(this.dest); node.connect(this.analyser);
      // Fin du partage ≠ fin de la réunion : on continue avec le micro seul.

    /* --- MediaRecorder par « parties » */
    startPart() {

      // AAC (Safari) devient médiocre sous 32 kbps : plancher à 32 pour ce codec ; Opus tient très bien 24 kbps en voix.
      const kbps = Math.max(PROFILES[this.profile].kbps, (mime || "").includes("mp4") ? 32 : 0);
      const rec = new MediaRecorder(this.dest.stream, { ...(mime ? { mimeType: mime } : {}), audioBitsPerSecond: kbps * 1000 });

      rec.onerror = () => { try { rec.state !== "inactive" && rec.stop(); } catch {} };
      rec.onstop = () => {
        if (this.rec !== rec || this.intended === "stopped") return;

        this.logEvent("Enregistreur relancé automatiquement");
        setTimeout(() => this.startPart(), 800);
      };
      rec.start(CHUNK_MS);
      if (this.intended === "paused") rec.pause();
    }
    saveChunk(part, seq, blob) {
      this.lastChunk = Date.now();
      this.saving = this.saving.then(() => store.put(CH, { key: ckey(this.id, part, seq), id: this.id, part, seq, blob })).then(() => scheduleFlush(this.id));
    }

    /* --- interruptions (appel, perte du micro) */
    beginInt(reason) {
      if (this.openInt || this.intended === "stopped") return;
      this.openInt = { at: Math.round(this.elapsed()), t: Date.now(), reason };
      this.setState("interrupted");
    }
    endInt() {
      if (!this.openInt) return;
      const i = this.openInt; this.openInt = null;
      this.events.push({ at: i.at, duration: Math.round((Date.now() - i.t) / 1000), reason: i.reason });
      this.persist();
      if (this.intended !== "stopped") this.setState(this.intended === "paused" ? "paused" : "recording");
      this.onEvent(`Enregistrement repris (interruption de ${Math.round((Date.now() - i.t) / 1000)} s)`);
    }
    logEvent(msg) { this.events.push({ at: Math.round(this.elapsed()), reason: msg.slice(0, 60) }); this.onEvent(msg); this.persist(); }

    /** Rouvre le micro après une coupure. Réessaie ; si un geste utilisateur est exigé → état « needs-tap ». */
    async recover(gesture = false) {

      this.recovering = true;
      try {
        for (let i = 0; this.intended !== "stopped"; i++) {

          try { await this.attachMic(); this.endInt(); if (this.rec?.state === "inactive") this.startPart(); return; }
          catch (e) {

    }

    /** Surveillance périodique et à chaque événement système. */
    check() {

      if (this.ctx && this.ctx.state !== "running") this.ctx.resume().catch(() => {});
      const t = this.micTrack;
      if (t?.readyState === "ended") { if (this.state !== "needs-tap") { this.beginInt("micro coupé"); this.recover(); } }

    }

    async wakeLock() {
      try { if (document.visibilityState === "visible" && (!this.wake || this.wake.released)) this.wake = await navigator.wakeLock?.request("screen"); } catch {}
    }

    pause() { if (this.intended !== "recording") return; this.acc = this.elapsed(); this.intended = "paused"; this.t0 = 0; try { this.rec.pause(); } catch {} this.setState("paused"); }
    resume() { if (this.intended !== "paused") return; this.intended = "recording"; this.t0 = Date.now(); try { this.rec.resume(); } catch {} this.setState(this.openInt ? "interrupted" : "recording"); }
    mark() { this.markers.push(Math.round(this.elapsed())); this.persist(); return this.markers.length; }
    async persist() {
      const cur = (await store.get(SES, this.id)) || {};
      await store.put(SES, { registered: !!this.registered, ...cur, id: this.id, meta: this.meta, markers: this.markers, events: this.events, startedAt: this.startedAt,
        payload: { meta: this.meta, markers: this.markers, interruptions: this.events } });
    }
    /** Hors-ligne tout l'audio vit sur l'appareil : on demande un stockage durable et on prévient s'il est trop juste. */
    async storageCheck() {
      try {
        await navigator.storage?.persist?.();
        const e = await navigator.storage?.estimate?.();
        if (e?.quota && e.quota - e.usage < 300 * 1024 * 1024) this.onEvent("⚠ Espace de stockage faible sur l'appareil : libérez de la place ou rétablissez le réseau pour envoyer l'audio");
      } catch {}
    }

    /** Arrête, vide les derniers segments et lance le traitement. Lève une erreur si le réseau manque (le reste est repris plus tard). */
    async finish(metaUpdate = {}, extra = {}) {
      if (this.openInt) this.endInt();
      this.intended = "stopped"; this.acc = this.elapsed();
      clearInterval(this.watchdog);
      document.removeEventListener("visibilitychange", this._vis); window.removeEventListener("online", this._vis);
      await new Promise((res) => { const rec = this.rec; if (!rec || rec.state === "inactive") return res(); const prev = rec.onstop; rec.onstop = () => { res(); }; try { rec.stop(); } catch { res(); } });
      await this.saving;
      this.teardown();
      this.setState("stopped");
      const payload = { meta: { ...this.meta, ...Object.fromEntries(Object.entries(metaUpdate).filter(([, v]) => v)) }, markers: this.markers, interruptions: this.events,
        attachment_ids: extra.attachment_ids || [] };   // pièces jointes déposées sur le serveur, rattachées à la réunion à la finalisation
      return requestFinish(this.id, payload);

    async cancel() {
      this.intended = "stopped"; clearInterval(this.watchdog);
      try { this.rec?.state !== "inactive" && this.rec.stop(); } catch {}
      this.teardown(); await this.saving; await discard(this.id);
      fetch("/api/meetings/" + this.id, { method: "DELETE" }).catch(() => {});
      this.setState("stopped");
    }
    teardown() {
      cancelAnimationFrame(this.raf); clearInterval(this.watchdog);
      this.micStream?.getTracks().forEach((t) => t.stop());
      this.dispStream?.getTracks().forEach((t) => t.stop());
      this.ctx?.close().catch(() => {}); this.wake?.release?.().catch?.(() => {});
    }
    get active() { return this.intended === "recording" || this.intended === "paused"; }
  }

  /* ---------------------------------------------------------------- enregistreur NATIF (application Android)
     Même interface que Session : l'enregistrement est assuré par un service Android (écran verrouillé, appel, mode avion),
     la page ne fait que le piloter. */
  const NATIVE = () => { try { return window.GMeetingNative && window.GMeetingNative.isAvailable() ? window.GMeetingNative : null; } catch { return null; } };
  class NativeSession {
    constructor({ onState = () => {}, onLevel = () => {}, onEvent = () => {} } = {}) {
      Object.assign(this, { onState, onLevel, onEvent });

    }
    static supported() { return !!NATIVE(); }
    static adopt() {                      // la page a été rechargée alors que l'enregistrement natif continue : on se rebranche dessus
      const n = NATIVE(); if (!n) return null;
      let st; try { st = JSON.parse(n.state()); } catch { return null; }
      if (!st || !["recording", "paused", "interrupted"].includes(st.state)) return null;

    }
    elapsed() { return this.sec; }
    setState(st) { if (this.state !== st) { this.state = st; this.onState(st); } }
    get active() { return this.intended === "recording" || this.intended === "paused"; }

    async start(meta, withTab, profile = "equilibre") {
      if (withTab) throw new Error("Le partage d'un onglet n'existe pas dans l'application : utilisez le micro (placez le téléphone près de la source).");
      const n = this.n;

        await new Promise((res) => { const f = () => { window.removeEventListener("gmeeting-permissions", f); res(); }; window.addEventListener("gmeeting-permissions", f); n.requestPermissions(); setTimeout(f, 60000); });
        if (!n.hasMicPermission()) throw new Error("Autorisez le micro pour enregistrer (Réglages Android → Applications → GMeeting → Autorisations).");
      }
      this.meta = meta;
      const id = n.start(JSON.stringify(meta || {}), (PROFILES[profile] || PROFILES.equilibre).kbps);
      if (!id) throw new Error("Impossible de démarrer l'enregistrement.");
      this.id = id; this.startPoll();
      // le service démarre de façon asynchrone : on attend le premier état (ou son erreur)
      for (let i = 0; i < 20; i++) {
        await sleep(150); const st = this.poll();
        if (st && st.state !== "idle") return id;
        if (st && st.error) break;
      }
      this.stopPoll(); this.intended = "stopped";
      const err = (() => { try { return JSON.parse(n.state()).error; } catch { return ""; } })();
      throw new Error(err || "Micro indisponible : un appel ou une autre application l'utilise-t-il ?");
    }
    startPoll() { this.intended = "recording"; this.stopPoll(); this.timer = setInterval(() => this.poll(), 400); this.poll(); }
    stopPoll() { clearInterval(this.timer); }
    poll() {
      let st; try { st = JSON.parse(this.n.state()); } catch { return null; }
      if (!st) return null;
      if (st.state === "idle") {
        if (this.intended !== "stopped" && this.state !== "idle") { this.intended = "stopped"; this.setState("stopped"); this.stopPoll(); }   // arrêté depuis la notification
        return st;
      }
      this.sec = st.elapsed || 0; this.onLevel(st.level || 0);
      this.intended = st.state === "paused" ? "paused" : "recording";
      this.setState(st.state);
      return st;
    }
    pause() { this.n.pause(); }
    resume() { this.n.resume(); }
    mark() { this.n.mark(); return ++this.markCount; }
    recover() {}
    async finish(metaUpdate = {}, extra = {}) {
      this.intended = "stopped"; this.stopPoll();
      const meta = { ...(this.meta || {}), ...Object.fromEntries(Object.entries(metaUpdate).filter(([, v]) => v)) };
      this.n.finish(JSON.stringify({ meta, attachment_ids: extra.attachment_ids || [] }));
      this.setState("stopped");
      // La réunion n'existe sur le serveur qu'une fois le dernier segment reçu : on attend un peu, sinon l'envoi continue en arrière-plan.
      for (let i = 0; i < 30; i++) {
        await sleep(1000);
        try { const r = await fetch("/api/meetings/" + this.id, { cache: "no-store" }); if (r.ok) return true; } catch {}
      }
      throw new Error("pending");
    }
    async cancel() { this.intended = "stopped"; this.stopPoll(); this.n.cancel(); this.setState("stopped"); }
  }

  return { PROFILES, get Session() { return NATIVE() ? NativeSession : Session; }, adoptNative: () => NativeSession.adopt(), orphans, discard, requestFinish, completeFinish, resumePending, flush, pendingCount, onProgress: (f) => (listeners.add(f), () => listeners.delete(f)), store };
})();

/* GMeeting – interface (JS natif, sans build). Tout contenu dynamique passe par textContent. */

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k.startsWith("aria-")) n.setAttribute(k, String(v));      // ARIA exige "true"/"false", pas un attribut vide
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 5000);
}
async function api(path, opts) {
  const r = await fetch("/api" + path, opts);
  if (!r.ok) {
    let d = r.statusText; try { d = (await r.json()).detail || d; } catch {}
    throw new Error(typeof d === "string" ? d : JSON.stringify(d));
  }
  return r.json();
}
const fmtDur = (s) => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return (h ? h + " h " : "") + m + " min"; };
const fmtDate = (iso) => new Date(iso).toLocaleString("fr-FR", { dateStyle: "medium", timeStyle: "short" });

let stopPoll = () => {}, stopRecorderCleanup = () => {};
window.addEventListener("hashchange", route);
let live = null; // session d'enregistrement active (survit à la navigation entre pages)
window.addEventListener("beforeunload", (e) => { if (live?.active) { e.preventDefault(); e.returnValue = ""; } });

async function route() {
  stopPoll(); stopRecorderCleanup();
  const m = location.hash.match(/^#\/m\/(\w+)/);
  if (location.hash === "#/brand") await viewBrand();
  else m ? await viewMeeting(m[1]) : await viewHome();
}

/* ---- pièces jointes : e-mails Outlook (.msg/.eml), Word, Excel, PDF, PowerPoint, texte, images ---- */
const ATT_ACCEPT = ".msg,.eml,.docx,.xlsx,.xlsm,.csv,.pdf,.pptx,.txt,.md,.png,.jpg,.jpeg,.gif,.webp,.doc,.xls,.ppt";
const KIND_EMOJI = { email: "✉️", word: "📄", excel: "📊", pdf: "📕", powerpoint: "📽️", texte: "📝", image: "🖼️", autre: "📎" };
const fmtSize = (n) => (n < 1048576 ? Math.max(1, Math.round(n / 1024)) + " Ko" : (n / 1048576).toFixed(1).replace(".", ",") + " Mo");
let staged = [];                                   // pièces déposées avant la création de la réunion
const attachmentIds = () => staged.map((a) => a.id);

async function uploadFiles(files, meetingId) {
  const fd = new FormData(); [...files].forEach((f) => fd.append("files", f)); if (meetingId) fd.append("meeting_id", meetingId);
  const r = await api("/attachments", { method: "POST", body: fd });
  (r.errors || []).forEach((e) => toast(e));
  return r.attachments;
}
function attachZone() {
  const list = el("ul", { class: "att-list" });
  const input = el("input", { type: "file", multiple: true, accept: ATT_ACCEPT, "aria-label": "Ajouter des pièces jointes" });
  const draw = () => list.replaceChildren(...staged.map((a) => el("li", {}, el("span", {}, KIND_EMOJI[a.kind] || "📎"),
    el("span", { class: "an" }, el("b", {}, a.name), el("small", {}, `${a.label} · ${fmtSize(a.size)}${a.snippet ? " — " + a.snippet.slice(0, 90) : ""}`)),
    el("button", { class: "x", type: "button", "aria-label": "Retirer " + a.name, onclick: async () => { staged = staged.filter((s) => s.id !== a.id); draw(); api("/attachments/" + a.id, { method: "DELETE" }).catch(() => {}); } }, "✕"))));
  input.onchange = async () => {
    if (!input.files.length) return;
    try { staged.push(...(await uploadFiles(input.files))); draw(); } catch (e) { toast(e.message); }
    input.value = "";
  };
  draw();
  return el("div", {}, input, list, el("p", { class: "hint" }, "Mail Outlook (.msg ou .eml), Word, Excel, PDF, PowerPoint, texte, images. Elles sont lues par l'IA pour mieux rédiger (noms, chiffres, ordre du jour) et insérées en annexe des rapports."));
}

      el("span", {}, el("strong", {}, m.title || "Sans titre"), el("br"), el("span", { class: "hint" }, fmtDate(m.created_at) + (m.duration ? " · " + fmtDur(m.duration) : "") + " · " + ({ url: "lien", upload: "fichier", record: "enregistrement", text: "texte" }[m.source_type] || m.source_type))),
      el("span", { class: "badge " + m.status }, STATUS[m.status] || m.status)))) : [el("li", { class: "empty" }, "Aucune réunion pour l'instant.")]));
  } catch (e) {

const STATE_MSG = {
  interrupted: "⚠ Micro interrompu (appel en cours ?). L'enregistrement reprendra tout seul à la fin de l'appel — gardez cette page ouverte.",
  paused: "⏸ En pause.",
  "needs-tap": "Le navigateur demande une confirmation pour rouvrir le micro.",
};

/** Enregistrements locaux non terminés (page fermée ou rechargée en cours de réunion) : on propose de les récupérer. */
async function orphanBanner() {
  const items = await GRec.orphans(live?.id);
  const card = $app.querySelector(".card");
  for (const o of items.reverse()) {
    const box = el("div", { class: "alert", role: "alert" });
    const go = el("button", { class: "btn" }, "Récupérer et générer les documents");
    go.onclick = async () => {
      go.disabled = true;
      try { await GRec.requestFinish(o.id, o.payload); location.hash = "#/m/" + o.id; route(); }
      catch (e) { toast("Envoi impossible pour l'instant (" + e.message + "). Réessayez avec une connexion."); go.disabled = false; }
    };
    const drop = el("button", { class: "btn danger" }, "Supprimer");
    drop.onclick = async () => { if (!confirm("Supprimer définitivement cet enregistrement ?")) return; await GRec.discard(o.id); fetch("/api/meetings/" + o.id, { method: "DELETE" }).catch(() => {}); box.remove(); };
    box.append(el("strong", {}, "⚠ Un enregistrement n'a pas été terminé"), el("br"),
      `« ${o.meta?.title || "Sans titre"} », démarré le ${fmtDate(o.startedAt)}. ` +
      (o.pending ? `${o.pending} segment(s) audio sont conservés sur cet appareil et n'ont pas encore été envoyés. ` : "Tout l'audio a été envoyé. "),
      el("div", { class: "row", style: "margin-top:10px" }, go, drop));
    card.before(box);
  }
}

/** Conseil « mode avion » : l'interface doit avoir été chargée une fois en ligne pour pouvoir s'ouvrir sans réseau. */
function offlineTip() {
  const ready = !!navigator.serviceWorker?.controller;
  return el("p", { class: "hint", style: "max-width:520px;margin:8px auto" },
    el("strong", {}, "✈ Mode avion : "), "vous pouvez enregistrer sans aucun réseau, donc sans appel qui coupe le micro. ",
    ready ? "L'application est prête pour l'usage hors-ligne. Activez le mode avion (vous pouvez ensuite rallumer le Wi-Fi seul si besoin) puis lancez l'enregistrement ; l'envoi se fera au retour du réseau."
      : "Pour cela, rechargez cette page une fois en ligne (installation hors-ligne en cours), puis installez l'application sur l'écran d'accueil si possible.");
}

function recPanel() {
  const timer = el("div", { class: "timer", "aria-live": "off" }, "00:00:00");
  const meter = el("div", { class: "meter" }, el("i"));
  const btn = el("button", { class: "rec-btn", "aria-label": "Démarrer l'enregistrement" }, "REC");
  const pauseBtn = el("button", { class: "btn sec", hidden: true }, "⏸ Pause");
  const markBtn = el("button", { class: "btn sec", hidden: true, title: "Repérer un moment important" }, "⭐ Marquer");
  const stopBtn = el("button", { class: "btn", hidden: true }, "⏹ Terminer et générer");
  const tapBtn = el("button", { class: "btn", hidden: true, style: "background:var(--rec);border-color:var(--rec)" }, "🎙 Reprendre l'enregistrement");
  const banner = el("div", { class: "rec-banner", role: "status", hidden: true });
  const net = el("p", { class: "hint", role: "status" });
  const log = el("ul", { class: "hint", style: "list-style:none;padding:0;margin:6px 0" });
  const savedQ = (() => { try { return localStorage.getItem("gm_audio_profile"); } catch { return null; } })();
  const quality = el("select", { id: "rec-quality", "aria-label": "Qualité audio", title: "Compromis qualité / taille de l'enregistrement" },
    ...Object.entries(GRec.PROFILES).map(([k, p]) => el("option", { value: k, selected: k === (GRec.PROFILES[savedQ] ? savedQ : "equilibre") }, `Audio : ${p.label}`)));
  const qualityNote = el("p", { class: "hint", style: "margin:2px 0 0" });
  const showQ = () => { qualityNote.textContent = GRec.PROFILES[quality.value].note + " · mono, voix optimisée"; try { localStorage.setItem("gm_audio_profile", quality.value); } catch {} };
  quality.onchange = showQ; showQ();
  const mode = el("select", { id: "rec-mode", "aria-label": "Source audio" },
    el("option", { value: "mic" }, "Micro seul (présentiel, téléphone)"),
    el("option", { value: "tab" }, "Micro + audio de l'onglet (visio web)"));
  let iv = 0, unsub = () => {};

  const ui = (running) => {
    btn.hidden = running; pauseBtn.hidden = markBtn.hidden = stopBtn.hidden = !running; mode.disabled = quality.disabled = running;
    btn.classList.toggle("live", running);
    if (!running) { meter.firstChild.style.width = "0"; banner.hidden = true; tapBtn.hidden = true; }
  };
  const say = (msg) => { if (!msg) return; const t = new Date().toLocaleTimeString("fr-FR"); log.append(el("li", {}, `${t} — ${msg}`)); };
  const showState = (st) => {
    banner.hidden = !STATE_MSG[st]; banner.textContent = STATE_MSG[st] || ""; banner.className = "rec-banner " + st;
    tapBtn.hidden = st !== "needs-tap";
    pauseBtn.textContent = st === "paused" ? "▶ Reprendre" : "⏸ Pause";
    if (st === "interrupted") say("Interruption du micro");
  };
  const showNet = async () => {
    if (!live) return; const n = await GRec.pendingCount(live.id);
    net.textContent = !navigator.onLine ? `✈ Hors connexion (mode avion ?) — l'enregistrement se poursuit normalement. L'audio est conservé sur cet appareil et sera envoyé automatiquement au retour du réseau (${n} segment(s) en attente).`
      : n > 3 ? `Envoi en cours… ${n} segment(s) en attente.` : "";
  };

  btn.onclick = async () => {
    if (!GRec.Session.supported()) return toast("Enregistrement non supporté par ce navigateur.");
    btn.disabled = true;
    const s = new GRec.Session({
      onState: showState,
      onLevel: (l) => (meter.firstChild.style.width = Math.min(100, l * 140) + "%"),
      onEvent: (m) => say(m),
    });
    try { await s.start(meta(), mode.value === "tab", quality.value); }
    catch (e) { toast(e.message); btn.disabled = false; return; }
    live = s; btn.disabled = false; ui(true); log.replaceChildren();
    iv = setInterval(() => { const sec = s.elapsed(); timer.dataset.s = sec; timer.textContent = new Date(sec * 1000).toISOString().substr(11, 8); showNet(); }, 500);
    unsub = GRec.onProgress(showNet);
  };
  pauseBtn.onclick = () => (live.state === "paused" ? live.resume() : live.pause());
  markBtn.onclick = () => { const n = live.mark(); say(`⭐ Repère n°${n} à ${timer.textContent}`); toast("Moment marqué ⭐"); };
  tapBtn.onclick = () => live.recover(true);
  stopBtn.onclick = async () => {
    stopBtn.disabled = true; const s = live;
    try {
      const done = await s.finish(meta(), { attachment_ids: attachmentIds() });
      staged = [];
      live = null; clearInterval(iv); unsub();
      location.hash = "#/m/" + s.id;
      if (!done) toast("Enregistrement terminé.");
    } catch (e) {
      // réseau absent : tout est conservé localement et sera finalisé automatiquement au retour de la connexion
      live = null; clearInterval(iv); unsub(); ui(false);
      toast("Enregistrement terminé. Envoi en attente de connexion : il reprendra automatiquement.");
      route();
    }
  };
  // revenir sur l'onglet Enregistrer pendant une session en cours : on rebranche l'interface sur la session active
  if (!live) live = GRec.adoptNative?.() || null;      // application Android : l'enregistrement natif a continué pendant que la page était fermée
  if (live?.active) {
    live.onState = showState; live.onLevel = (l) => (meter.firstChild.style.width = Math.min(100, l * 140) + "%"); live.onEvent = say;
    ui(true); showState(live.state); const s = live;
    iv = setInterval(() => { const sec = s.elapsed(); timer.textContent = new Date(sec * 1000).toISOString().substr(11, 8); showNet(); }, 500);
    unsub = GRec.onProgress(showNet);
  }
  stopRecorderCleanup = () => { clearInterval(iv); unsub(); }; // la session continue même si l'on change de page
  return el("div", { class: "rec-box" }, el("div", { class: "row", style: "justify-content:center" }, mode, quality), qualityNote, timer, meter, banner,
    el("div", { class: "row", style: "justify-content:center;margin:12px 0" }, btn, pauseBtn, markBtn, stopBtn), tapBtn, net, log,
    ...(window.GMeetingNative ? [el("p", { class: "hint" }, "Enregistrement assuré par l'application : il continue écran verrouillé et pendant un appel, et l'audio non envoyé reste sur le téléphone.")] : [offlineTip(),
    el("p", { class: "hint" }, "L'audio est écrit sur l'appareil puis envoyé en continu : une coupure réseau, un appel téléphonique ou la fermeture de la page ne font pas perdre l'enregistrement. " +
      "Gardez la page ouverte et l'écran allumé. L'accès au micro exige HTTPS ou localhost.")]));
}

async function loadConfig() {
  try {
    const c = await api("/config");
    const warn = [];
    if (!c.has_anthropic) warn.push("clé ANTHROPIC_API_KEY manquante");
    if (c.transcribe_provider === "openai" && !c.has_openai) warn.push("aucun moteur de transcription configuré");
    document.getElementById("cfg").textContent = warn.length ? "⚠ " + warn.join(" · ") : `Transcription : ${c.transcribe_provider} · Rédaction : ${c.model}`;
  } catch {}
}

/* ============================================================ DÉTAIL */
async function viewMeeting(id) {
  let tab = sessionStorage.getItem("tab") || "pv";
  const head = el("div"), body = el("div");
  $app.replaceChildren(el("p", { class: "no-print" }, el("a", { href: "#/" }, "← Toutes les réunions")), head, body);
  let m, polling = true, lastKey = "";
  stopPoll = () => (polling = false);

  const render = async () => {
    const key = [m.status, m.progress, tab, m.analysis ? 1 : 0, m.rec_info?.chunks, m.atts_stale ? 1 : 0].join("|");
    if (key === lastKey) return; lastKey = key;
    head.replaceChildren(el("h1", {}, m.title || "Réunion sans titre"),
      el("p", { class: "hint" }, fmtDate(m.created_at) + (m.duration ? " · " + fmtDur(m.duration) : "") + (m.source_url ? " · " + m.source_url : "")));
    if (m.status === "recording") {
      const ri = m.rec_info || {}, mine = live?.id === m.id && live.active;
      body.replaceChildren(el("div", { class: "card" },
        el("strong", {}, mine ? "● Enregistrement en cours sur cet appareil" : "Enregistrement non finalisé"), el("br"),
        el("span", { class: "hint" }, `${ri.chunks || 0} segment(s) reçus` + (ri.last_chunk_age != null ? ` · dernier il y a ${ri.last_chunk_age} s` : "")),
        mine ? el("p", {}, el("a", { href: "#/" }, "Retour à l'enregistreur")) :
          el("div", { class: "row", style: "margin-top:12px" },
            el("button", { class: "btn", onclick: () => finishRecording(id) }, "Finaliser et générer les documents"),

    }

        el("div", { class: "row", style: "margin-top:12px" },

    const content = el("div", { class: "card" });

      "Régénérez pour que les rapports en tiennent compte (citations des sources, recoupements, suivi des actions antérieures). ",
      el("div", { class: "row", style: "margin-top:8px" }, el("button", { class: "btn", type: "button", onclick: () => regenerate(id) }, "↻ Régénérer maintenant"))) : null;
    fill(body, stale, tabs, content);

    else if (tab === "attachments") await attView(content, id);
    else if (tab === "transcript") transcriptView(content);
    else infosView(content);
  };

  const tick = async () => {
    while (polling) {
      try { m = window.__m = await api("/meetings/" + id); await render(); } catch (e) { toast(e.message); }
      if (m && ["done", "error"].includes(m.status) && polling) {
        // reste actif uniquement pour détecter une régénération
        await new Promise((r) => setTimeout(r, 4000));
      } else await new Promise((r) => setTimeout(r, 1800));
    }
  };
  tick();
}

    el("label", {}, "Participants"), part, el("label", {}, "Contexte / consignes"), ctx,
    el("div", { class: "row", style: "margin-top:12px" }, save,
      el("button", { class: "btn sec", onclick: () => regenerate(m.id) }, "↻ Régénérer les documents"),
      el("button", { class: "btn danger", onclick: () => del(m.id) }, "Supprimer")));
}

async function retryMeeting(id) {
  try { await api(`/meetings/${id}/retry`, { method: "POST" }); route(); }
  catch (e) { toast(e.message); }
}
async function finishRecording(id) {
  try { await api(`/recordings/${id}/finish`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); route(); }
  catch (e) { toast(e.message); }
}
async function regenerate(id) { try { await api(`/meetings/${id}/regenerate`, { method: "POST" }); location.hash = "#/m/" + id; route(); } catch (e) { toast(e.message); } }
async function del(id) { if (!confirm("Supprimer définitivement cette réunion et ses documents ?")) return; try { await api("/meetings/" + id, { method: "DELETE" }); location.hash = "#/"; } catch (e) { toast(e.message); } }

/* ---- indicateur d'enregistrement visible sur toutes les pages ---- */
const recbar = document.getElementById("recbar");
setInterval(() => {
  if (!live?.active) { recbar.hidden = true; return; }
  recbar.hidden = false;
  recbar.className = "recbar" + (live.state === "recording" ? "" : " warn");
  const t = new Date(live.elapsed() * 1000).toISOString().substr(11, 8);
  recbar.textContent = ({ interrupted: "⚠ Interrompu ", paused: "⏸ Pause ", "needs-tap": "⚠ Toucher pour reprendre " }[live.state] || "● REC ") + t;
}, 1000);

/* ---- application installable + ouverture hors-ligne ---- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
GRec.resumePending();   // termine d'éventuelles fins d'enregistrement restées en attente (réseau absent)
route();
</script>
